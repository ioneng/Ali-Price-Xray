<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ali-Price-Xray mobile fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #eee; font-family: system-ui, sans-serif; }
    .card { width: 100%; min-height: 620px; padding: 12px; background: #fff; }
    .product-image { display: block; width: 100%; height: 300px; background: #ddd; }
    .price { display: block; margin-top: 12px; font-size: 22px; }
    @media (orientation: landscape), (min-width: 600px) {
      html[data-side="left"] .card,
      html[data-side="right"] .card { width: 50%; }
      html[data-side="right"] .card { margin-left: auto; }
    }
  </style>
  <script>
    const fixtureParams = new URLSearchParams(location.search);
    document.documentElement.dataset.side = fixtureParams.get('side') || 'right';
    Object.defineProperty(navigator, 'userAgent', {
      value: `${navigator.userAgent} Android${fixtureParams.has('tablet') ? ' Tablet' : ' Mobile'}`,
      configurable: true
    });

    const optionImage = (label, color) => `data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
        <rect width="120" height="120" fill="${color}"/>
        <text x="60" y="66" text-anchor="middle" font-family="sans-serif" font-size="18" fill="white">${label}</text>
      </svg>
    `)}`;

    globalThis.browser = {
      runtime: {
        sendMessage: async () => ({
          ok: true,
          productId: '1005000000000000',
          prefs: { country: 'AU', currency: 'AUD', source: 'mobile fixture' },
          count: 7,
          saleableCount: 5,
          min: 25.79,
          max: 63.99,
          targetPriceString: 'AU$25.79',
          debug: { contextFields: ['pdp_ext_f', 'pdpNPI'] },
          skus: [
            { skuId: '1', skuAttr: '14:1#Tips only', skuPath: '14:1', salePrice: 25.79, salePriceString: 'AU$25.79', salable: true, stock: 8, imageUrl: optionImage('Tips', '#e0a800') },
            { skuId: '2', skuAttr: '200007763:AU;14:2#HS-02A iron', skuPath: '14:2;200007763:AU', salePrice: 42.99, salePriceString: 'AU$42.99', salable: true, stock: 28, imageUrl: optionImage('Iron', '#2374ab') },
            { skuId: '3', skuAttr: '14:3#100W US-C2C', salePrice: 50.69, salePriceString: 'AU$50.69', salable: true, stock: 28, imageUrl: optionImage('US', '#555') },
            { skuId: '4', skuAttr: '14:4#100W EU-C2C', salePrice: 50.69, salePriceString: 'AU$50.69', salable: true, stock: 28, imageUrl: optionImage('EU', '#555') },
            { skuId: '5', skuAttr: '14:5#Unavailable kit', salePrice: 63.99, salePriceString: 'AU$63.99', salable: false, stock: 0, imageUrl: optionImage('Kit', '#777') },
            { skuId: '6', skuAttr: '200007763:US;14:2#HS-02A iron', skuPath: '14:2;200007763:US', salePrice: 44.99, salePriceString: 'AU$44.99', salable: true, stock: 12, imageUrl: optionImage('Iron', '#2374ab') },
            { skuId: '7', skuAttr: '200007763:EU;14:2#HS-02A iron', skuPath: '14:2;200007763:EU', salePrice: 42.99, salePriceString: 'AU$42.99', salable: false, stock: 0, imageUrl: optionImage('Iron', '#2374ab') }
          ]
        })
      }
    };

  </script>
</head>
<body>
  <article class="card">
    <a href="https://www.aliexpress.com/item/1005000000000000.html">
      <span class="product-image"></span>
      <img alt="Test product" width="1" height="1">
      <span class="price">AU$25.79</span>
    </a>
  </article>
  <script src="../extension/content-sku-groups.js"></script>
  <script src="../extension/content.js"></script>
  <script src="../extension/content-sort.js"></script>
  <script src="../extension/content-sort-runtime.js"></script>
  <script>
    document.querySelector('.ali-price-xray-button')?.click();
    setTimeout(() => {
      if (location.hash === '#preview') {
        document.querySelector('.ali-price-xray-panel img')?.click();
      }
      if (location.hash === '#unavailable') {
        document.querySelector('.ali-price-xray-panel details > summary')?.click();
      }
    }, 0);
  </script>
</body>
</html>
